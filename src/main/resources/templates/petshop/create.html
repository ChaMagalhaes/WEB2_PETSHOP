<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{/../fragments/head :: head('Cadastrar Pet')}"></th:block>
<body>
<th:block th:replace="~{/../fragments/head :: header}"></th:block>

<div class="container pt-4">
  <h1>Cadastrar Pet</h1>
  <form action="#" th:action="@{/pet/save}" th:object="${pet}" method="POST">

    <div class="form-group row">
      <label for="name" class="col-sm-2 col-form-label">Nome:</label>
      <div class="col-sm-10">
        <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Digite o nome do pet">
        <p th:if="${#fields.hasErrors('name')}" th:errorclass="text-danger" th:errors="*{name}"></p>
      </div>
    </div>

    <div class="form-group row">
      <label for="especie" class="col-sm-2 col-form-label">Espécie:</label>
      <div class="col-sm-10">
        <input type="text" th:field="*{especie}" class="form-control" id="especie" placeholder="Ex: Cachorro, Gato, Coelho...">
        <p th:if="${#fields.hasErrors('especie')}" th:errorclass="text-danger" th:errors="*{especie}"></p>
      </div>
    </div>

    <div class="form-group row">
      <label for="idade" class="col-sm-2 col-form-label">Idade:</label>
      <div class="col-sm-10">
        <input type="number" th:field="*{idade}" class="form-control" id="idade" placeholder="Digite a idade do pet">
        <p th:if="${#fields.hasErrors('idade')}" th:errorclass="text-danger" th:errors="*{idade}"></p>
      </div>
    </div>

    <button type="submit" class="btn btn-info">Cadastrar Pet</button>
  </form>
</div>

<th:block th:replace="~{/../fragments/footer :: footer}"></th:block>
</body>
</html>
