<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Cadastrar Pet</title>

  <link
          rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous"
  />
</head>
<body>
<div class="container pt-5">
  <h1>Cadastrar Pet</h1>
  <form action="#" th:action="@{/pets/save}" th:object="${pet}" method="POST">
    <div class="form-group row">
      <label for="name" class="col-sm-2 col-form-label">Nome:</label>
      <div class="col-sm-10">
        <input type="text" th:field="*{name}" class="form-control" id="name" placeholder="Digite o nome do pet" required>
      </div>
    </div>

    <div class="form-group row">
      <label for="especie" class="col-sm-2 col-form-label">Espécie:</label>
      <div class="col-sm-10">
        <input type="text" th:field="*{especie}" class="form-control" id="especie" placeholder="Ex: Cachorro, Gato, Coelho..." required>
      </div>
    </div>

    <div class="form-group row">
      <label for="idade" class="col-sm-2 col-form-label">Idade:</label>
      <div class="col-sm-10">
        <input type="number" th:field="*{idade}" class="form-control" id="idade" min="0" placeholder="Digite a idade do pet" required>
      </div>
    </div>

    <button type="submit" class="btn btn-info col-2">Cadastrar Pet</button>
  </form>
</div>
</body>
</html>
