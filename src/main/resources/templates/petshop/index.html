<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<th:block th:replace="~{/../fragments/head :: head('Listar Pet')}"></th:block>
<body>
<th:block th:replace="~{/../fragments/head :: header}"></th:block>

<div class="container pt-4">
    <h1>Listagem de Pets</h1>
    <table class="table table-striped">
        <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">Nome</th>
            <th scope="col">Espécie</th>
            <th scope="col">Idade</th>
            <th scope="col">Excluir</th>
            <th scope="col">Editar</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pet : ${petsList}">
            <td scope="row" th:text="${pet.id}"></td>
            <td scope="row" th:text="${pet.name}"></td>
            <td scope="row" th:text="${pet.especie}"></td>
            <td scope="row" th:text="${pet.idade}"></td>
            <td>
                <a th:href="@{/pet/delete/{id}(id=${pet.id})}">Deletar</a>
            </td>
            <td>
                <a th:href="@{/pet/edit/{id}(id=${pet.id})}">Editar</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="row">
        <a th:href="@{/pet/create}">
            <button class="btn btn-primary">Cadastrar Pet</button>
        </a>
    </div>
</div>

<th:block th:replace="~{/../fragments/footer :: footer}"></th:block>
</body>
</html>
